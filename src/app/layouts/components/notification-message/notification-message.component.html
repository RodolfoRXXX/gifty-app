<!-- Notificación recibida -->

<a 
    [routerLink]="['/event', notification.eventId]" 
    class="a-notification soft-grey-background btn-border"
    [ngClass]="notification.status == 1 ? 'border-primary' : ''"
    (click)="isReaded()">
    <!-- Contenedor del texto -->
    <div class="text-container flex-grow-1 me-3">
        <p class="font-14 mb-0 text-wrap">
            {{ notification?notification.action:'' }}
        </p>
        <small class="font-10">{{ isBeen(notification.created) }}</small>
    </div>
    
    <!-- Ícono a la derecha -->
    <div>
        <span class="material-symbols-outlined align-icon primary-color" style="font-size: 20px;">
            {{ notification?notification.icon:'' }}
        </span>
    </div>
</a>
