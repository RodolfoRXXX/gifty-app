<!-- Caja de mensajes con dedicatoria de cada persona que hizo un regalo -->

<mat-card class="card box-size">
    <mat-card-content class="p-0" style="height: 100%;">
        <div class="d-flex flex-column justify-content-between" style="height: 100%;">
            <div class="d-flex justify-content-between align-items-center">
                <p class="font-12 mb-0">
                    <span class="fw-semibold cap p-1" *ngIf="message.gifterId.startsWith('%')">{{ message.gifterId.slice(1) }}</span>
                    <a *ngIf="!message.gifterId.startsWith('%')" [routerLink]="['../../profile', message.gifterId]" class="fw-semibold cap">{{ message.userName || message.email.split('@')[0] }}</a> 
                    dice:
                </p>
                <span class="material-symbols-outlined align-icon primary-color" *ngIf="message.profileId">
                    person_check
                </span>
                <span class="material-symbols-outlined align-icon primary-color" *ngIf="!message.profileId">
                    person_add
                </span>
            </div>
            <div class="d-flex align-items-center">
                <p class="font-15 text-center mb-0 fw-semibold">
                    "{{ message.message }}”
                </p>
            </div>
            <div class="d-flex justify-content-end">
                <span 
                    class="font-12 b-all btn-border primary-color soft-grey-background fw-400 ps-2 pe-2">
                    {{ ((daysSince(message.created)>0)?'Hace ' + daysSince(message.created) + ' días':'Hoy') }}
                </span>
            </div>
        </div>
    </mat-card-content>
</mat-card>
